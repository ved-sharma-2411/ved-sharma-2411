name: GitHub Snake Game

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_bg=00000000&frame_duration=800&nb_frames=20
            dist/github-snake-dark.svg?palette=github-dark&color_bg=00000000&frame_duration=800&nb_frames=20
            dist/github-snake-cyber.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#0f172a,#164e63,#0891b2,#22d3ee,#f97316&color_bg=00000000&frame_duration=800&nb_frames=20
            dist/github-snake-ocean.svg?color_snake=#0891b2&color_dots=#e0f2fe,#bae6fd,#7dd3fc,#38bdf8,#f97316&color_bg=00000000&frame_duration=800&nb_frames=20
            dist/github-snake-terminal.svg?color_snake=#22c55e&color_dots=#052e16,#166534,#16a34a,#22c55e,#86efac&color_bg=00000000&frame_duration=800&nb_frames=20
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_bg=00000000&frame_duration=800&nb_frames=20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
