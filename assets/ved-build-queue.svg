<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Ved Sharma build queue">
  <defs>
    <style><![CDATA[
      text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      @keyframes scan{0%{transform:translateX(-180px)}100%{transform:translateX(1120px)}}
      @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
      .scan{animation:scan 5.5s linear infinite}
      .dot{animation:blink 2s ease-in-out infinite}
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#071827"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1098" height="358" rx="18" fill="url(#bg)" stroke="#164e63"/>
  <rect class="scan" x="0" y="0" width="180" height="360" fill="url(#shine)"/>
  <text x="34" y="46" font-size="18" fill="#e2e8f0">Build Queue</text>
  <text x="34" y="74" font-size="12" fill="#94a3b8">What is live, shipped, in the lab, and being rebuilt.</text>

  <g transform="translate(34 112)">
    <rect x="0" y="0" width="1032" height="38" rx="9" fill="#08111f" stroke="#164e63"/>
    <circle class="dot" cx="24" cy="19" r="5" fill="#22c55e"/><text x="44" y="24" font-size="12" fill="#22c55e">LIVE</text>
    <text x="150" y="24" font-size="12" fill="#e2e8f0">production RAG chatbot</text>
    <text x="500" y="24" font-size="12" fill="#94a3b8">automated ingestion + grounded answers</text>

    <rect x="0" y="48" width="1032" height="38" rx="9" fill="#08111f" stroke="#263548"/>
    <circle class="dot" cx="24" cy="67" r="5" fill="#22c55e"/><text x="44" y="72" font-size="12" fill="#22c55e">LIVE</text>
    <text x="150" y="72" font-size="12" fill="#e2e8f0">PDF / CSV intelligence system</text>
    <text x="500" y="72" font-size="12" fill="#94a3b8">AWS processing + review workflows</text>

    <rect x="0" y="96" width="1032" height="38" rx="9" fill="#08111f" stroke="#263548"/>
    <circle cx="24" cy="115" r="5" fill="#38bdf8"/><text x="44" y="120" font-size="12" fill="#67e8f9">BUILT</text>
    <text x="150" y="120" font-size="12" fill="#e2e8f0">school ERP + admin panel</text>
    <text x="500" y="120" font-size="12" fill="#94a3b8">mobile app + role-based operations</text>

    <rect x="0" y="144" width="1032" height="38" rx="9" fill="#08111f" stroke="#263548"/>
    <circle cx="24" cy="163" r="5" fill="#38bdf8"/><text x="44" y="168" font-size="12" fill="#67e8f9">BUILT</text>
    <text x="150" y="168" font-size="12" fill="#e2e8f0">SaaS / product experiments</text>
    <text x="500" y="168" font-size="12" fill="#94a3b8">PDF tools, POS, appointments, inventory</text>

    <rect x="0" y="192" width="1032" height="38" rx="9" fill="#08111f" stroke="#263548"/>
    <circle class="dot" cx="24" cy="211" r="5" fill="#f97316"/><text x="44" y="216" font-size="12" fill="#fdba74">LAB</text>
    <text x="150" y="216" font-size="12" fill="#e2e8f0">AI voice agent</text>
    <text x="500" y="216" font-size="12" fill="#94a3b8">realtime conversation + API orchestration</text>
  </g>
</svg>
